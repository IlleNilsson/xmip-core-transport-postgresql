# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-transport-postgresql"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-transport-postgresql"
description = "PostgreSQL transport: the frontend/backend protocol 3.0 in its simple query flow — a Receive Location runs a query and each row is a Stream, a Send Location inserts a Stream as a row; trust and cleartext login. A xmip-core-transport technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). Standard library otherwise: the protocol is a type
# byte, a length and text.
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
